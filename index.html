<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 导航 — 发现最好的 AI 工具</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ===== Reset & Base ===== */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --accent: #4F46E5;
    --accent-hover: #4338CA;
    --accent-light: #EEF2FF;
    --accent-soft: rgba(79,70,229,0.08);
    --bg: #F7F7F5;
    --surface: #FFFFFF;
    --surface2: #F0EFF9;
    --border: rgba(0,0,0,0.08);
    --border-hover: rgba(79,70,229,0.35);
    --text-primary: #1A1825;
    --text-secondary: #6B6880;
    --text-muted: #A09CB0;
    --sidebar-w: 220px;
    --radius: 14px;
    --radius-sm: 8px;
    --shadow: 0 2px 12px rgba(0,0,0,0.06);
    --shadow-hover: 0 8px 28px rgba(79,70,229,0.14);
    --font: 'Plus Jakarta Sans', sans-serif;
  }

  html { font-family: var(--font); background: var(--bg); color: var(--text-primary); scroll-behavior: smooth; }
  body { display: flex; min-height: 100vh; }
  a { text-decoration: none; color: inherit; }

  /* ===== Sidebar ===== */
  .sidebar {
    width: var(--sidebar-w);
    background: var(--surface);
    border-right: 1px solid var(--border);
    position: fixed;
    top: 0; left: 0; bottom: 0;
    overflow-y: auto;
    z-index: 100;
    padding: 24px 0;
    display: flex;
    flex-direction: column;
    transition: transform 0.25s ease;
  }

  .sidebar-logo {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 20px 24px;
    border-bottom: 1px solid var(--border);
  }
  .logo-icon {
    width: 36px; height: 36px;
    background: var(--accent);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }
  .logo-text { font-size: 16px; font-weight: 700; color: var(--text-primary); }
  .logo-sub { font-size: 11px; color: var(--text-muted); font-weight: 400; }

  .sidebar-section { margin-top: 16px; }
  .sidebar-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-muted);
    padding: 0 20px 8px;
  }
  .sidebar-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 20px;
    font-size: 13.5px;
    font-weight: 500;
    color: var(--text-secondary);
    cursor: pointer;
    transition: all 0.15s;
    border-left: 2.5px solid transparent;
    position: relative;
  }
  .sidebar-item:hover { background: var(--accent-soft); color: var(--accent); border-left-color: transparent; }
  .sidebar-item.active { background: var(--accent-soft); color: var(--accent); border-left-color: var(--accent); font-weight: 600; }
  .sidebar-item .s-icon { font-size: 17px; width: 20px; text-align: center; }
  .sidebar-count {
    margin-left: auto;
    font-size: 11px;
    font-weight: 600;
    background: var(--accent-light);
    color: var(--accent);
    padding: 1px 7px;
    border-radius: 20px;
  }

  .sidebar-footer {
    margin-top: auto;
    padding: 20px;
    border-top: 1px solid var(--border);
    font-size: 12px;
    color: var(--text-muted);
  }

  /* ===== Main Content ===== */
  .main {
    margin-left: var(--sidebar-w);
    flex: 1;
    display: flex;
    flex-direction: column;
  }

  /* ===== Hero / Search ===== */
  .hero {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 48px 40px 32px;
    text-align: center;
  }
  .hero-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--accent-light);
    color: var(--accent);
    font-size: 12px;
    font-weight: 600;
    padding: 4px 12px;
    border-radius: 20px;
    margin-bottom: 16px;
    letter-spacing: 0.02em;
  }
  .hero h1 {
    font-size: clamp(28px, 4vw, 42px);
    font-weight: 700;
    color: var(--text-primary);
    line-height: 1.2;
    margin-bottom: 8px;
    letter-spacing: -0.02em;
  }
  .hero h1 span { color: var(--accent); }
  .hero p {
    font-size: 15px;
    color: var(--text-secondary);
    margin-bottom: 28px;
    font-weight: 400;
  }

  .search-wrap {
    max-width: 600px;
    margin: 0 auto 16px;
    position: relative;
  }
  .search-wrap input {
    width: 100%;
    height: 52px;
    border: 1.5px solid var(--border);
    border-radius: 26px;
    padding: 0 52px 0 52px;
    font-size: 15px;
    font-family: var(--font);
    color: var(--text-primary);
    background: var(--bg);
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .search-wrap input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(79,70,229,0.1); }
  .search-wrap input::placeholder { color: var(--text-muted); }
  .search-icon {
    position: absolute;
    left: 18px; top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    font-size: 18px;
    pointer-events: none;
  }
  .search-clear {
    position: absolute;
    right: 16px; top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    font-size: 14px;
    cursor: pointer;
    background: none; border: none;
    display: none;
    padding: 4px 6px;
    border-radius: 50%;
    transition: background 0.15s;
    font-family: var(--font);
  }
  .search-clear:hover { background: var(--accent-light); color: var(--accent); }

  .search-engines {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-size: 12.5px;
    color: var(--text-muted);
    flex-wrap: wrap;
  }
  .search-engines span { font-weight: 500; }
  .engine-btn {
    padding: 4px 12px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-secondary);
    font-size: 12px;
    font-weight: 500;
    font-family: var(--font);
    cursor: pointer;
    transition: all 0.15s;
    text-decoration: none;
    display: inline-flex; align-items: center; gap: 4px;
  }
  .engine-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }

  /* ===== Category Tabs ===== */
  .tab-bar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 40px;
    overflow-x: auto;
    display: flex;
    align-items: center;
    gap: 4px;
    position: sticky;
    top: 0;
    z-index: 50;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .tab-bar::-webkit-scrollbar { display: none; }
  .tab-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 14px 16px;
    font-size: 13.5px;
    font-weight: 500;
    font-family: var(--font);
    color: var(--text-secondary);
    border: none;
    background: none;
    cursor: pointer;
    white-space: nowrap;
    border-bottom: 2px solid transparent;
    transition: all 0.15s;
    margin-bottom: -1px;
  }
  .tab-btn:hover { color: var(--text-primary); }
  .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
  .tab-btn .t-emoji { font-size: 15px; }

  /* ===== Tools Grid ===== */
  .content {
    padding: 32px 40px;
    flex: 1;
  }
  .section-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 20px;
  }
  .section-title {
    font-size: 17px;
    font-weight: 700;
    color: var(--text-primary);
  }
  .section-count {
    font-size: 13px;
    color: var(--text-muted);
    font-weight: 400;
  }

  .tools-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 16px;
  }

  .tool-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
    display: flex;
    flex-direction: column;
    gap: 12px;
    position: relative;
    overflow: hidden;
  }
  .tool-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: transparent;
    transition: background 0.2s;
  }
  .tool-card:hover {
    transform: translateY(-3px);
    box-shadow: var(--shadow-hover);
    border-color: var(--border-hover);
  }
  .tool-card:hover::before { background: var(--accent); }

  .card-top { display: flex; align-items: center; gap: 12px; }
  .tool-icon {
    width: 44px; height: 44px;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    flex-shrink: 0;
  }
  .tool-name { font-size: 15px; font-weight: 700; color: var(--text-primary); }
  .tool-category-tag {
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 20px;
    display: inline-block;
    margin-top: 2px;
  }
  .tool-desc {
    font-size: 13px;
    color: var(--text-secondary);
    line-height: 1.55;
    flex: 1;
  }
  .card-bottom {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-top: 10px;
    border-top: 1px solid var(--border);
  }
  .tool-link {
    font-size: 12px;
    font-weight: 600;
    color: var(--accent);
    display: flex; align-items: center; gap: 3px;
    transition: gap 0.15s;
  }
  .tool-card:hover .tool-link { gap: 6px; }
  .free-badge {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding: 2px 7px;
    border-radius: 6px;
  }

  /* ===== Empty State ===== */
  .empty-state {
    grid-column: 1 / -1;
    text-align: center;
    padding: 60px 20px;
    color: var(--text-muted);
  }
  .empty-state .e-icon { font-size: 48px; margin-bottom: 12px; }
  .empty-state h3 { font-size: 16px; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px; }
  .empty-state p { font-size: 14px; }

  /* ===== Section dividers ===== */
  .category-section { margin-bottom: 40px; }
  .category-section-title {
    font-size: 18px;
    font-weight: 700;
    color: var(--text-primary);
    margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  /* ===== Mobile menu toggle ===== */
  .menu-toggle {
    display: none;
    position: fixed;
    top: 14px; left: 14px;
    z-index: 200;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px 10px;
    cursor: pointer;
    font-size: 18px;
    box-shadow: var(--shadow);
  }
  .sidebar-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.3);
    z-index: 99;
  }

  /* ===== Stats bar ===== */
  .stats-bar {
    background: linear-gradient(135deg, #F0EFF9 0%, #EEF2FF 100%);
    border-bottom: 1px solid var(--border);
    padding: 10px 40px;
    display: flex;
    align-items: center;
    gap: 24px;
    font-size: 12.5px;
    color: var(--text-secondary);
    font-weight: 500;
  }
  .stat-item { display: flex; align-items: center; gap: 5px; }
  .stat-num { color: var(--accent); font-weight: 700; }

  /* ===== Responsive ===== */
  @media (max-width: 768px) {
    .sidebar { transform: translateX(-100%); }
    .sidebar.open { transform: translateX(0); }
    .sidebar-overlay.show { display: block; }
    .main { margin-left: 0; }
    .menu-toggle { display: flex; align-items: center; }
    .hero { padding: 60px 20px 28px; }
    .content { padding: 24px 16px; }
    .tab-bar { padding: 0 16px; }
    .stats-bar { padding: 10px 16px; gap: 12px; }
    .tools-grid { grid-template-columns: 1fr 1fr; gap: 12px; }
  }
  @media (max-width: 480px) {
    .tools-grid { grid-template-columns: 1fr; }
  }

  /* ===== Animations ===== */
  .tool-card {
    animation: fadeIn 0.35s ease both;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .tool-card:nth-child(1) { animation-delay: 0s; }
  .tool-card:nth-child(2) { animation-delay: 0.04s; }
  .tool-card:nth-child(3) { animation-delay: 0.08s; }
  .tool-card:nth-child(4) { animation-delay: 0.12s; }
  .tool-card:nth-child(5) { animation-delay: 0.16s; }
  .tool-card:nth-child(6) { animation-delay: 0.20s; }
  .tool-card:nth-child(7) { animation-delay: 0.24s; }
  .tool-card:nth-child(8) { animation-delay: 0.28s; }
</style>
</head>

</main>

// Category config
const CATEGORIES = {
  all:     { label: '全部工具', emoji: '🏠' },
  writing: { label: 'AI 写作',  emoji: '✍️' },
  image:   { label: 'AI 图像',  emoji: '🎨' },
  video:   { label: 'AI 视频',  emoji: '🎬' },
  coding:  { label: 'AI 编程',  emoji: '💻' },
  search:  { label: 'AI 搜索',  emoji: '🔍' },
  office:  { label: 'AI 办公',  emoji: '📊' },
};

const CATEGORY_COLORS = {
  writing: { bg: '#EEF2FF', text: '#4338CA' },
  image:   { bg: '#FDF4FF', text: '#7E22CE' },
  video:   { bg: '#FFF7ED', text: '#C2410C' },
  coding:  { bg: '#F0FDF4', text: '#15803D' },
  search:  { bg: '#F0FDFA', text: '#0F766E' },
  office:  { bg: '#EFF6FF', text: '#1D4ED8' },
};

let currentCategory = 'all';
let currentQuery = '';

// ===== Render =====
function renderTools(tools) {
  const grid = document.getElementById('toolsGrid');
  if (!tools.length) {
    grid.innerHTML = `
      <div class="empty-state">
        <div class="e-icon">🔭</div>
        <h3>没有找到相关工具</h3>
        <p>试试其他关键词，或者 <a href="#" style="color:var(--accent)">清空搜索</a></p>
      </div>`;
    return;
  }

  // Group by category when showing all
  if (currentCategory === 'all' && !currentQuery) {
    const groups = {};
    tools.forEach(t => {
      if (!groups[t.category]) groups[t.category] = [];
      groups[t.category].push(t);
    });
    let html = '';
    Object.entries(groups).forEach(([cat, items]) => {
      const cfg = CATEGORIES[cat];
      html += `<div class="category-section" style="grid-column:1/-1">
        <div class="category-section-title">${cfg.emoji} ${cfg.label} <span style="font-size:13px;color:var(--text-muted);font-weight:400">(${items.length})</span></div>
        <div class="tools-grid" style="margin:0">`;
      items.forEach(t => { html += toolCardHTML(t); });
      html += `</div></div>`;
    });
    grid.style.display = 'block';
    grid.innerHTML = html;
  } else {
    grid.style.display = 'grid';
    grid.innerHTML = tools.map(toolCardHTML).join('');
  }
}

function toolCardHTML(t) {
  const cc = CATEGORY_COLORS[t.category] || { bg: '#F3F4F6', text: '#374151' };
  const freeBadge = t.free
    ? `<span class="free-badge" style="background:#ECFDF5;color:#059669">免费</span>`
    : `<span class="free-badge" style="background:#FEF3C7;color:#D97706">付费</span>`;
  return `
    <div class="tool-card" onclick="openTool('${t.url}', '${t.name}')">
      <div class="card-top">
        <div class="tool-icon" style="background:${t.iconBg};color:${t.iconFg}">${t.emoji}</div>
        <div>
          <div class="tool-name">${t.name}</div>
          <span class="tool-category-tag" style="background:${cc.bg};color:${cc.text}">${t.catLabel}</span>
        </div>
      </div>
      <div class="tool-desc">${t.desc}</div>
      <div class="card-bottom">
        <span class="tool-link">立即体验 →</span>
        ${freeBadge}
      </div>
    </div>`;
}

function openTool(url, name) {
  window.open(url, '_blank');
}

// ===== Filter Logic =====
function applyFilter() {
  let filtered = TOOLS;
  if (currentCategory !== 'all') {
    filtered = filtered.filter(t => t.category === currentCategory);
  }
  if (currentQuery) {
    const q = currentQuery.toLowerCase();
    filtered = filtered.filter(t =>
      t.name.toLowerCase().includes(q) ||
      t.desc.toLowerCase().includes(q) ||
      t.catLabel.toLowerCase().includes(q)
    );
  }

  const cat = CATEGORIES[currentCategory];
  document.getElementById('sectionTitle').textContent = currentQuery
    ? `搜索 "${currentQuery}"` : cat.label;
  document.getElementById('sectionCount').textContent = `显示 ${filtered.length} 个工具`;

  renderTools(filtered);
  updateSearchEngines(currentQuery);
}

function filterCategory(cat, el) {
  currentCategory = cat;

  // Update tabs
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.cat === cat));
  // Update sidebar
  document.querySelectorAll('.sidebar-item').forEach(b => b.classList.toggle('active', b.dataset.category === cat));

  applyFilter();
  // Close sidebar on mobile
  if (window.innerWidth < 769) closeSidebar();
}

// ===== Search =====
const searchInput = document.getElementById('searchInput');
const searchClear = document.getElementById('searchClear');

searchInput.addEventListener('input', function() {
  currentQuery = this.value.trim();
  searchClear.style.display = currentQuery ? 'block' : 'none';
  applyFilter();
});

function clearSearch() {
  searchInput.value = '';
  currentQuery = '';
  searchClear.style.display = 'none';
  searchInput.focus();
  applyFilter();
}

function updateSearchEngines(q) {
  const enc = encodeURIComponent(q || 'AI 工具');
  document.getElementById('googleBtn').href = `https://google.com/search?q=${enc}`;
  document.getElementById('bingBtn').href = `https://bing.com/search?q=${enc}`;
  document.getElementById('perplexityBtn').href = `https://perplexity.ai/search?q=${enc}`;
  document.getElementById('baiduBtn').href = `https://baidu.com/s?wd=${enc}`;
}

// ===== Sidebar Counts =====
function updateSidebarCounts() {
  const cats = ['writing','image','video','coding','search','office'];
  cats.forEach(c => {
    const el = document.getElementById('sc-' + c);
    if (el) el.textContent = TOOLS.filter(t => t.category === c).length;
  });
  document.getElementById('sc-all').textContent = TOOLS.length;
}

// ===== Mobile Sidebar =====
document.getElementById('menuToggle').addEventListener('click', () => {
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('sidebarOverlay').classList.add('show');
});
document.getElementById('sidebarOverlay').addEventListener('click', closeSidebar);
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarOverlay').classList.remove('show');
}

// ===== Init =====
updateSidebarCounts();
updateSearchEngines('');
applyFilter();
</script>
